name: GomokuApp
options:
  bundleIdPrefix: com.skillgomoku
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    version: "11.0.0"
  SnapKit:
    url: https://github.com/SnapKit/SnapKit
    version: "5.7.0"

targets:
  GomokuApp:
    type: application
    platform: iOS
    sources:
      - path: GomokuApp
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: GomokuApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.skillgomoku.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: SnapKit
    info:
      path: GomokuApp/Info.plist
      properties:
        CFBundleDisplayName: 技能五子棋
        CFBundleName: GomokuApp
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  GomokuApp:
    build:
      targets:
        GomokuApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release